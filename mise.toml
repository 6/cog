# Local dev tooling only. cog.py itself has ZERO runtime dependencies —
# these tools are just for linting, formatting, and type-checking during
# development. End users never need mise or any of these installed.
[tools]
ruff = "0.15.10"                 # lint + format
"pipx:basedpyright" = "1.39.0"   # static type checker

[tasks.test]
description = "Run the unittest suite"
run = "python3 -m unittest discover tests"

[tasks.lint]
description = "Lint with ruff (ignore E701/E702 — terse one-liners are intentional)"
run = "ruff check --ignore E701,E702 cog.py tests"

[tasks.typecheck]
description = "Type-check with basedpyright (fails only on errors, warnings ignored)"
run = '''basedpyright --outputjson cog.py | python3 -c "import json,sys; s=json.load(sys.stdin)['summary']; print(s['errorCount'],'errors,',s['warningCount'],'warnings'); sys.exit(1 if s['errorCount'] else 0)"'''
